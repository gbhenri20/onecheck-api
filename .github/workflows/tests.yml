name: Testes

on:
  push:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: onecheck
          POSTGRES_PASSWORD: onecheck
          POSTGRES_DB: onecheck_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_DATABASE_URL: postgresql://onecheck:onecheck@localhost:5432/onecheck_test
      JWT_SECRET: ci-secret-only-for-tests
      SEED_SECRET: ci-seed-secret

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-test.txt

      - name: Instalar dependências
        run: pip install -r requirements.txt -r requirements-test.txt

      - name: Rodar testes
        run: pytest --cov-fail-under=70
